# cargo-fuzz harnesses for hdf5rs (not part of the published crate, and not
# a member of its workspace).
#
#   cargo install cargo-fuzz          # running needs a nightly toolchain
#   cargo +nightly fuzz list
#   cargo +nightly fuzz run open_walk -- -max_total_time=300 -rss_limit_mb=1024
#
# cargo-fuzz builds with `--cfg fuzzing`, which disables metadata checksum
# verification in hdf5rs so that mutated inputs reach the deeper parsers.
#
# Seed corpus from tests/fixtures (written as fuzz/corpus/<target>/...):
#
#   HDF5RS_FUZZ_WRITE_CORPUS=fuzz/corpus cargo test --test stress
#
# The same harnesses (tests/support/{walk,parsers}.rs) run on stable Rust in
# the mutation stress test, tests/stress.rs.

[package]
name = "hdf5rs-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hdf5rs = { path = "..", features = ["all-filters"] }

# A workspace of its own, so the parent package never pulls it in.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "open_walk"
path = "fuzz_targets/open_walk.rs"
test = false
doc = false
bench = false

[[bin]]
name = "object_header"
path = "fuzz_targets/object_header.rs"
