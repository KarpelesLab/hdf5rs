[package]
name = "hdf5rs"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
description = "Pure Rust, minimal-dependency reader and writer for HDF5 files"
license = "MIT"
repository = "https://github.com/KarpelesLab/hdf5rs"
readme = "README.md"
keywords = ["hdf5", "scientific", "file-format", "pure-rust"]
categories = ["encoding", "parser-implementations", "science"]
exclude = ["/.github", "/tests/fixtures", "/tests/regressions", "/tools", "/fuzz"]

[dependencies]
compcol = { version = "0.7.3", default-features = false, features = ["alloc", "zlib"], optional = true }

[dev-dependencies]

[features]
default = ["deflate", "lzf"]
# The deflate (gzip) filter, via the `compcol` crate.
deflate = ["dep:compcol"]
# The LZF filter (id 32000, common in h5py output), via `compcol`.
lzf = ["dep:compcol", "compcol/lzf"]
# Zstandard filter (id 32015), via `compcol`.
zstd = ["dep:compcol", "compcol/zstd"]
# LZ4 filter (id 32004), via `compcol`.
lz4 = ["dep:compcol", "compcol/lz4"]
# BZIP2 filter (id 307), via `compcol`.
bzip2 = ["dep:compcol", "compcol/bzip2"]
# Blosc filter (id 32001) with its lz4, zlib, zstd and snappy codecs (not
# blosclz), via `compcol`.
blosc = ["dep:compcol", "compcol/lz4", "compcol/zstd", "compcol/snappy"]
# Bitshuffle filter (id 32008), optionally with lz4 or zstd, via `compcol`.
bitshuffle = ["dep:compcol", "compcol/lz4", "compcol/zstd"]
# Decode the chunks of one read on several threads (std::thread::scope).
parallel = []
# Every optional filter.
all-filters = ["deflate", "lzf", "zstd", "lz4", "bzip2", "blosc", "bitshuffle"]

[lints.rust]
# `cfg(fuzzing)` is set by cargo-fuzz (and the stress test's checksum-free
# mode); it disables metadata checksum verification.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
