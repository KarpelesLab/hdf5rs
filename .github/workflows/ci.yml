name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.toolchain }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, "1.95"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo build --all-targets
      - run: cargo test
      - run: cargo test --no-default-features
      - run: cargo test --all-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  interop:
    name: interop (files written by hdf5rs, read by h5py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install h5py numpy
      - run: |
          set -e
          out="$RUNNER_TEMP/written"
          mkdir -p "$out"
          cargo run --example write_demo -- "$out/v2.h5" v2
          cargo run --example write_demo -- "$out/v3.h5" v3
          cargo run --example write_demo -- "$out/o4.h5" v3 o4 times
          cargo run --example write_demo -- "$out/v0.h5" v0
          python tools/check_written.py "$out"/*.h5
      - name: read-write mode (files modified by hdf5rs, checked by h5py)
        run: |
          cargo build --examples
          python tools/check_modified.py --bin target/debug/examples

  stress:
    name: stress (mutated fixtures, stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # A different (but reproducible) seed on every run; failing inputs
      # are saved for download.
      - name: checksums verified
        run: cargo test --release --all-features --test stress
        env:
          HDF5RS_FUZZ_ITERS: "150000"
          HDF5RS_FUZZ_SEED: ${{ github.run_number }}
          HDF5RS_FUZZ_DUMP: ${{ runner.temp }}/stress
      - name: checksums ignored (as under cargo-fuzz)
        run: cargo test --release --all-features --test stress
        env:
          RUSTFLAGS: -D warnings --cfg fuzzing
          HDF5RS_FUZZ_ITERS: "150000"
          HDF5RS_FUZZ_SEED: ${{ github.run_number }}
          HDF5RS_FUZZ_DUMP: ${{ runner.temp }}/stress
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stress-failures
          path: ${{ runner.temp }}/stress

  fuzz:
    name: fuzz (libFuzzer, time-boxed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: seed corpus from the fixtures
        run: cargo test --release --test stress
        env:
          HDF5RS_FUZZ_WRITE_CORPUS: ${{ github.workspace }}/fuzz/corpus
      # cargo-fuzz's instrumentation flags (sanitizer coverage works on
      # stable; no address sanitizer, which safe Rust does not need).
      - name: build fuzz targets
        working-directory: fuzz
        run: cargo build --release --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: >-
            --cfg fuzzing -Cdebug-assertions -Coverflow-checks
            -Cpasses=sancov-module
            -Cllvm-args=-sanitizer-coverage-level=4
            -Cllvm-args=-sanitizer-coverage-inline-8bit-counters
            -Cllvm-args=-sanitizer-coverage-pc-table
            -Cllvm-args=-sanitizer-coverage-trace-compares
      - name: run every target for 30 s
        working-directory: fuzz
        run: |
          set -e
          mkdir -p artifacts
          for t in $(ls fuzz_targets | sed 's/\.rs$//'); do
            echo "::group::$t"
            ./target/x86_64-unknown-linux-gnu/release/$t corpus/$t \
              -max_total_time=30 -rss_limit_mb=2048 -malloc_limit_mb=1024 \
              -timeout=20 -max_len=262144 -artifact_prefix=artifacts/$t-
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
